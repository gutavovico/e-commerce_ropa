# CI de FashionStore: las mismas pruebas que se ejecutan en local, en cada PR hacia main y en
# cada push a main. Ninguna toca producción. Ver la sección «CI y PR» de CLAUDE.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ec-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Ec-backend/requirements.txt
      - name: Dependencias
        run: pip install -r requirements.txt "pytest>=8,<9" "httpx>=0.27,<1"
      - name: Pruebas unitarias (sesión simulada; conftest.py fija valores de marcador)
        run: python -m pytest -q --ignore=tests/integracion

  migraciones:
    name: Backend · migraciones
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fashionstore_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Base temporal del propio job: no es Neon ni producción.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fashionstore_ci
      JWT_SECRET: solo-ci-sin-valor
    defaults:
      run:
        working-directory: Ec-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Ec-backend/requirements.txt
      - name: Dependencias
        run: pip install -r requirements.txt "pytest>=8,<9" "httpx>=0.27,<1"
      - name: Una sola cabeza en la cadena de Alembic
        run: |
          python -m alembic heads
          cabezas=$(python -m alembic heads | grep -c "(head)")
          if [ "$cabezas" -ne 1 ]; then
            echo "::error::La cadena de Alembic tiene $cabezas cabezas: dos migraciones comparten número o down_revision."
            exit 1
          fi
      - name: Toda la cadena desde una base vacía
        run: python -m alembic upgrade head
      - name: La última migración se deshace y se vuelve a aplicar
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head
      - name: El ORM coincide con el esquema migrado (test_esquema_bd)
        run: |
          printf 'DATABASE_URL_PRUEBAS=%s\n' "$DATABASE_URL" > .env
          python -m pytest -q -rs tests/test_esquema_bd.py | tee salida.txt
          if grep -q "SKIPPED" salida.txt; then
            echo "::error::test_esquema_bd se omitió: no encontró la base."
            exit 1
          fi

  integracion:
    name: Backend · integración (rama pruebas-multitenant)
    runs-on: ubuntu-latest
    # Los PR desde forks no reciben secretos; las ramas del propio repositorio sí.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      PRUEBAS_APP: ${{ secrets.DATABASE_URL_PRUEBAS_APP }}
    defaults:
      run:
        working-directory: Ec-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Ec-backend/requirements.txt
      - name: Dependencias
        run: pip install -r requirements.txt "pytest>=8,<9" "httpx>=0.27,<1"
      - name: Exigir el secreto (sin él, las pruebas se omitirían en silencio)
        run: |
          if [ -z "$PRUEBAS_APP" ]; then
            echo "::error::Falta el secreto DATABASE_URL_PRUEBAS_APP (Settings → Secrets → Actions)."
            exit 1
          fi
      - name: Pruebas de aislamiento con el rol fashionstore_app (cada una se deshace)
        run: |
          printf 'DATABASE_URL_PRUEBAS_APP=%s\n' "$PRUEBAS_APP" > .env
          python -m pytest -q -rs tests/integracion | tee salida.txt
          if grep -q "SKIPPED" salida.txt; then
            echo "::error::Las pruebas de integración se omitieron."
            exit 1
          fi

  web:
    name: Web · tsc, ng test y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ec-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Ec-frontend/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Pruebas (siempre con ng test, nunca con vitest directo)
        run: npx ng test --watch=false
      - name: Build de producción
        run: npx ng build

  movil:
    name: Móvil · analyze y flutter test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ec-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Análisis estático (debe terminar en «No issues found!»)
        run: dart analyze --fatal-infos
      - run: flutter test

  guardas:
    name: Guardas · secretos y reglas de CLAUDE.md
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks lee los commits del PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reglas del proyecto
        run: bash .github/scripts/guardas.sh
      - name: Secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
