<div
  class="min-h-screen w-full flex flex-col items-center justify-center relative bg-neutral-950 bg-cover bg-center overflow-x-hidden p-4 sm:p-6"
  style="background-image: linear-gradient(to bottom, rgba(15, 15, 15, 0.45) 0%, rgba(10, 10, 10, 0.55) 100%), url('/atelier_bg.jpg');"
>
  <!-- Contenedor Central Flotante -->
  <div class="w-full max-w-[440px] flex flex-col items-center z-10 animate-fadeIn">
    
    <!-- 1. Badge Superior Flotante FS -->
    <div
      class="w-14 h-14 bg-white rounded-2xl shadow-xl flex items-center justify-center mb-5 select-none border border-neutral-100/80"
      aria-hidden="true"
    >
      <span class="font-sans font-bold text-xl tracking-wider text-black">FS</span>
    </div>

    <!-- 2. Tarjeta Central Inmaculada (Museum Canvas) -->
    <main
      class="w-full bg-white rounded-[28px] shadow-2xl p-8 sm:p-10 border border-white/60 backdrop-blur-sm"
      role="region"
      aria-labelledby="login-title"
    >
      <!-- Encabezado Editorial -->
      <header class="text-center mb-7">
        <p class="text-[11px] font-medium tracking-[0.2em] uppercase text-neutral-500 mb-1.5">
          — BIENVENIDO DE VUELTA —
        </p>
        <h1
          id="login-title"
          class="text-2xl sm:text-[28px] font-semibold text-neutral-950 uppercase tracking-[0.08em]"
        >
          FASHION STORE
        </h1>
      </header>

      <!-- Mensaje de Notificación de Error -->
      @if (mensajeError()) {
        <div
          class="mb-6 p-3.5 bg-red-50/90 border border-red-200/80 rounded-lg flex items-start gap-2.5 text-xs text-red-800 animate-fadeIn"
          role="alert"
        >
          <svg class="w-4 h-4 text-red-600 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke-width="2" />
            <line x1="12" y1="8" x2="12" y2="12" stroke-width="2" />
            <line x1="12" y1="16" x2="12.01" y2="16" stroke-width="2" />
          </svg>
          <span class="leading-relaxed">{{ mensajeError() }}</span>
        </div>
      }

      <!-- Mensaje de Notificación de Éxito -->
      @if (exito()) {
        <div
          class="mb-6 p-3.5 bg-emerald-50/90 border border-emerald-200/80 rounded-lg flex items-center gap-2.5 text-xs text-emerald-800 animate-fadeIn"
          role="status"
        >
          <svg class="w-4 h-4 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
          <span class="font-medium">Sesión verificada. Redirigiendo a la boutique...</span>
        </div>
      }

      <!-- Formulario de Autenticación -->
      <form [formGroup]="formulario" (ngSubmit)="onSubmit()" novalidate class="space-y-5">
        
        <!-- Campo: Correo Electrónico -->
        <div>
          <label
            for="email-input"
            class="block text-[11px] font-semibold uppercase tracking-[0.08em] text-neutral-700 mb-2"
          >
            CORREO ELECTRÓNICO
          </label>
          <div
            class="relative flex items-center bg-[#F4F4F5] rounded-lg border border-transparent focus-within:border-neutral-900 focus-within:bg-white transition-all duration-150"
          >
            <div class="pl-3.5 text-neutral-500 flex items-center pointer-events-none">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4" stroke-width="1.8" />
                <path d="M16 8v5a3 3 0 006 0v-1a10 10 0 10-3.92 7.94" stroke-width="1.8" />
              </svg>
            </div>
            <input
              id="email-input"
              type="email"
              formControlName="email"
              placeholder="nombre@ejemplo.com"
              autocomplete="email"
              class="w-full py-3 pl-2.5 pr-4 bg-transparent text-sm text-neutral-900 placeholder:text-neutral-400 focus:outline-none"
            />
          </div>
        </div>

        <!-- Campo: Contraseña -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label
              for="password-input"
              class="block text-[11px] font-semibold uppercase tracking-[0.08em] text-neutral-700"
            >
              CONTRASEÑA
            </label>
            <a
              href="javascript:void(0)"
              class="text-xs text-neutral-500 hover:text-neutral-900 hover:underline transition-colors"
              title="Recuperar acceso a tu cuenta"
            >
              ¿Olvidaste tu contraseña?
            </a>
          </div>

          <div
            class="relative flex items-center bg-[#F4F4F5] rounded-lg border border-transparent focus-within:border-neutral-900 focus-within:bg-white transition-all duration-150"
          >
            <div class="pl-3.5 text-neutral-500 flex items-center pointer-events-none">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke-width="1.8" />
                <path d="M7 11V7a5 5 0 0110 0v4" stroke-width="1.8" />
              </svg>
            </div>
            <input
              id="password-input"
              [type]="mostrarPassword() ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••••••"
              autocomplete="current-password"
              class="w-full py-3 pl-2.5 pr-10 bg-transparent text-sm text-neutral-900 placeholder:text-neutral-400 focus:outline-none tracking-wider"
            />
            <!-- Botón para Mostrar / Ocultar Contraseña -->
            <button
              type="button"
              (click)="toggleMostrarPassword()"
              class="absolute right-3 text-neutral-400 hover:text-neutral-700 focus:outline-none transition-colors p-1"
              [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
            >
              @if (mostrarPassword()) {
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                </svg>
              } @else {
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Casilla: Recordar en este dispositivo -->
        <div class="flex items-center gap-2.5 pt-1">
          <label class="flex items-center gap-2.5 cursor-pointer select-none">
            <input
              type="checkbox"
              formControlName="recordarDispositivo"
              class="w-4 h-4 rounded text-black bg-white border-neutral-300 focus:ring-0 focus:ring-offset-0 accent-black cursor-pointer"
            />
            <span class="text-xs sm:text-sm text-neutral-700">Recordar en este dispositivo</span>
          </label>
        </div>

        <!-- Botón de Envío: Iniciar Sesión -->
        <button
          type="submit"
          [disabled]="cargando()"
          class="w-full h-12 bg-black hover:bg-neutral-800 active:scale-[0.99] text-white text-xs sm:text-sm font-semibold tracking-[0.14em] uppercase rounded-lg transition-all duration-150 flex items-center justify-center gap-2 shadow-sm disabled:opacity-60 disabled:cursor-not-allowed mt-2"
        >
          @if (cargando()) {
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>AUTENTICANDO...</span>
          } @else {
            <span>INICIAR SESIÓN</span>
            <span class="text-base font-light select-none">→</span>
          }
        </button>

        <!-- Divisor Hairline -->
        <div class="w-full h-[1px] bg-neutral-200 my-6" aria-hidden="true"></div>

        <!-- Pie de Registro Exclusivo -->
        <footer class="text-center">
          <p class="text-xs text-neutral-500 mb-1">
            ¿Aún no tienes una cuenta exclusiva?
          </p>
          <a
            routerLink="/registro"
            class="text-xs font-semibold text-neutral-950 underline underline-offset-4 hover:text-black transition-colors"
          >
            Regístrate aquí
          </a>
        </footer>

      </form>
    </main>

    <!-- 3. Píldora de Seguridad Inferior -->
    <div class="mt-6 flex items-center justify-center gap-2 text-white/90 drop-shadow-sm select-none" aria-hidden="true">
      <svg class="w-4 h-4 text-white/80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
      <span class="text-[10px] uppercase tracking-[0.18em] font-medium">
        CONEXIÓN CIFRADA & PRIVACIDAD MAISON
      </span>
    </div>

  </div>
</div>
