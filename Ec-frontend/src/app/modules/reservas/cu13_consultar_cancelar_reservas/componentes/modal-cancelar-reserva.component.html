<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn"
  (click)="onCerrar()"
>
  <div
    class="relative w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-neutral-100"
    (click)="$event.stopPropagation()"
  >
    <div class="p-6 sm:p-7 space-y-5">
      <div>
        <p class="text-[10px] font-semibold uppercase tracking-widest text-neutral-400">
          {{ reserva.codigo_reserva }}
        </p>
        <h2 class="text-xl font-bold text-neutral-950 mt-1">Cancelar esta reserva</h2>
        <p class="text-sm text-neutral-500 mt-1">
          {{ reserva.sucursal.nombre }} — las prendas apartadas volverán a estar disponibles de
          inmediato.
        </p>
      </div>

      @if (error) {
        <div class="bg-[#FFDAD6] text-[#93000A] text-xs rounded-xl px-4 py-3">{{ error }}</div>
      }

      <div>
        <label
          for="motivo-cancelacion"
          class="block text-xs font-semibold uppercase tracking-wider text-neutral-600 mb-2"
        >
          Motivo de la cancelación
        </label>
        <textarea
          id="motivo-cancelacion"
          rows="3"
          [ngModel]="motivo()"
          (ngModelChange)="actualizarMotivo($event)"
          [maxlength]="motivoMax"
          [disabled]="cancelando"
          placeholder="Cuéntanos por qué cancelas, nos ayuda a mejorar el servicio…"
          class="w-full px-4 py-3 text-sm border border-neutral-200 rounded-2xl focus:border-neutral-900 focus:outline-none resize-none disabled:bg-neutral-50"
        ></textarea>
        <p class="text-[11px] text-neutral-400 mt-1 text-right">
          {{ motivo().length }} / {{ motivoMax }}
        </p>
      </div>

      <div class="flex gap-3 pt-2">
        <button
          type="button"
          (click)="onCerrar()"
          [disabled]="cancelando"
          class="flex-1 py-3 border border-neutral-200 text-neutral-700 text-xs font-semibold uppercase tracking-wider rounded-2xl hover:bg-neutral-50 transition-colors disabled:opacity-50"
        >
          Mantener reserva
        </button>
        <button
          type="button"
          (click)="onConfirmar()"
          [disabled]="!motivoValido || cancelando"
          class="flex-1 py-3 bg-[#93000A] text-white text-xs font-semibold uppercase tracking-wider rounded-2xl hover:bg-[#7a0008] transition-colors disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2"
        >
          @if (cancelando) {
            <span
              class="w-3.5 h-3.5 border-2 border-white/40 border-t-white rounded-full animate-spin"
            ></span>
          }
          <span>Confirmar cancelación</span>
        </button>
      </div>
    </div>
  </div>
</div>
