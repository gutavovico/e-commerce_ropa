<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Fashion Store &bull; Haute Couture & Ready-To-Wear</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts: Outfit & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN con configuración extendida para Fashion Store -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
          },
          colors: {
            brand: {
              gold: '#E8D8B8',
              black: '#000000',
              grayLight: '#F6F6F6',
              borderLight: '#E5E5E5'
            }
          },
          spacing: {
            'space-1': '2px',
            'space-2': '4px',
            'space-3': '8px',
            'space-4': '16px',
            'space-5': '32px',
            'space-6': '64px',
            'space-7': '128px',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white font-sans text-neutral-900 antialiased selection:bg-black selection:text-white">
  <app-root></app-root>
</body>
</html>
